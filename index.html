/* ═══ TURBO BALL · a Multiplayer Agent starter ═══════════════════════════════════════════
 * Rocket cars, one giant ball, two goals. Drive into the ball to shove it, jump to hit it in the
 * air, jump again in the air to flip into it hard. Boost pads refill your boost meter.
 * Versus, 2–8 players on two teams; bots fill every empty spot, so it's always at least 3 v 3.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ team size, match clock, arena size, car handling, boost, ball physics, the bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   ARENA ......... sizes, walls and corners, goals, kickoff spots, boost pads
 *   PHYSICS ....... the ball (walls, floor, cars) and the car (drive, boost, jump, flip)
 *   MATCH (HOST) .. teams, score, kickoffs, the clock, the winner. Only the host writes these.
 *   BOTS .......... the bot brain: one chases, one shadows between ball and goal, one guards and clears
 *   ME ............ my car, my boost, my own touches on the ball
 *   SCENE ......... the stadium, cars, ball, pads and particles (three.js, all shapes, no files)
 *   VIEWS ......... other cars, eased smoothly between their updates
 *   REPLAY ........ the slow-motion replay after a goal (each screen replays what it saw)
 *   DRAW .......... placing everything each frame, the cameras (car cam, ball cam, broadcast)
 *   HUD & RESULTS . scoreboard, clock, boost meter, messages, results card, leaderboard
 *   INPUT ......... keyboard, and a thumb stick + Jump / Boost buttons on touch
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player drives its OWN car on its own screen and writes it to its entity: `car`
 *     {x, z, a, h, vx, vz, va, b, f, q} (a = height, h = heading, b = boosting, f = flipping, q = boost
 *     left) about 15 times a second, `hb` (heartbeat) once a second, `rdy` (Play again), `n`/`c` (name, color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s), worked out
 *     every frame. The ball is shared, so the host owns it. Only the host writes the shared fields:
 *       `game` {id, v, phase, teams, score, ko, kickAt, resumeAt, endsAt, left, golden, win, overAt, goals, last}:
 *              who plays on which team (sessionIds, or bot ids "b1".."b9"), the score and the clock
 *              (timestamps). `v` goes up on every write; `ko` counts kickoffs (everyone goes to their spot).
 *       `ball` {x, y, z, vx, vy, vz, h, w, lt, s}: the ball ~15 times a second (h = touches so far,
 *              w = 1 waiting for kickoff / 2 just scored, lt = last toucher, s = write number).
 *       `bots` [{i, x, z, a, h, vx, vz, va, b, f, q}]: every bot car ~10 times a second.
 *   - The host moves the ball against the arena, its own car and the bots. Everyone else runs the
 *     ball on their own screen between writes and decides THEIR OWN car's touches: when your car hits
 *     the ball on your screen, it flies at once and you send "hit" {x, y, z, vx, vy, vz, g, ko}; the
 *     host checks it happened near its own ball and adopts it. A ball that crosses a goal line on the
 *     host's screen waits `goalGrace` ms for a save before it counts.
 *   - Someone who joins takes a bot's spot on the team with fewer people, mid-match; someone who
 *     leaves is replaced by a bot. A new host adopts `game`, `ball` and `bots` and carries on.
 *   - Boost pads are per car: a pad you drove over is empty for YOU for a few seconds (the others
 *     still see it full), so pads need no shared state. When any car's boost (`q`) goes up, every
 *     screen shows sparks on the pad it took, so you can see bots and other players filling up.
 *   - Cars bump: each screen works out the knock for the cars it drives (your own; the host's bots).
 *   - ?attract plays offline, bots only, broadcast camera (the preview video is recorded from it).
 *   - Leaderboard "turbo-goals": every goal you score adds 1 to your total.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {

  matchMs: 180000,      // match clock; it stops during goals and kickoffs. A tie goes to overtime (next goal wins)
  kickoffMs: 3000,      // ms everyone waits on their spot (3, 2, 1, GO)
  goalMs: 6200,         // ms after a goal: explosion, then the replay, then the next kickoff
  replayDelay: 1100,    // ms of explosion before the replay starts
  replayWindow: 2400,   // ms of play before the goal that the replay shows...
  replaySpeed: 0.5,     // ...at this speed (0.5 = half speed)
  resultsMs: 10000,     // ms on the results card before the next match
  // The arena, in metres: x runs along it (Red defends -x, Blue defends +x), z across it.

  goalW: 22, goalH: 8, goalDepth: 7,
  ballR: 2.6,           // the ball is big: about the size of a car
  gravity: 24,          // pulls the ball down, m/s²
  ballBounce: 0.62,     // share of speed a floor bounce keeps
  wallBounce: 0.72,     // share of speed a wall bounce keeps
  ballRoll: 0.32,       // how fast a rolling ball slows down
  maxBall: 62,          // fastest the ball can go, m/s
  carR: 1.9,            // the car's round "bumper" that touches the ball
  vmax: 23,             // top speed without boost, m/s
  boostMax: 34,         // top speed with boost
  accel: 20, brake: 42, coast: 6,
  turn: 2.5,            // steering, radians/s at speed
  grip: 7,              // how quickly sideways slide dies away
  airTurn: 2.2,         // turning in the air
  boostAccel: 26,       // extra push while boosting
  boostBurn: 34,        // boost used per second (the meter is 0–100)
  boostStart: 33,       // boost at every kickoff
  boostLift: 8,         // boosting in the air holds you up a little
  jumpV: 10.5,          // jump speed
  carGravity: 26,
  flipWindow: 1.3,      // s after a jump during which a second jump flips you forward
  flipSpeed: 11,        // the flip's forward kick, m/s
  flipTime: 0.55,       // s a flip lasts (it hits the ball harder meanwhile)
  hitBounce: 0.4,       // how springy a car is to the ball
  hitPush: 4,           // extra shove every touch gives the ball
  hitSpeedShare: 0.32,  // ...plus this share of the car's speed
  hitLift: 2.5,         // a touch on the side of the ball pops it up a little
  hitUp: 0.6,           // share of a touch's push that goes upward
  maxPop: 22,           // fastest a touch can send the ball upward, m/s
  flipPower: 1.5,       // a flipping car hits this much harder

  botError: 2.5,        // how far off bots aim, metres

  sendMs: 66,           // my car and the ball (~15 a second)

  goalGrace: 200,       // ms someone else has to save a ball that crossed the line on the host's screen
  board: "turbo-goals",

const COLORS = ["#ffd23f", "#ffffff", "#7cf2c9", "#c7a2ff", "#ff9f43", "#ff8fd0", "#a6f26b", "#7fe3ff"]; // each person's own color (roof and stripe)

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'turbo-ball',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',

  }).catch(() => { list.innerHTML = `<li class="note">Couldn't load the leaderboard.</li>`; });
}
$("again").onclick = () => { const g = game(); if (g && g.phase === "over") { myReady = g.id; net.me.set("rdy", g.id); } };

/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId picks again. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId);
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId)) return;
  const taken = new Set(others.map(([, p]) => p.c)); // bots are all silver, so only people's colors count
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
document.body.classList.toggle("touch", touchUI);
$("pad").hidden = !touchUI;
const KEYS = { arrowup: "gas", w: "gas", arrowdown: "rev", s: "rev", arrowleft: "left", a: "left", arrowright: "right", d: "right", shift: "boost", x: "boost" };
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase(); unlockAudio();
  if (KEYS[k]) { e.preventDefault(); input[KEYS[k]] = true; }
  if ((k === " " || k === "j") && !e.repeat) { e.preventDefault(); input.jump = true; }
  if (k === "c" && !e.repeat) input.ballCam = !input.ballCam;
});
addEventListener("keyup", (e) => { const k = KEYS[e.key.toLowerCase()]; if (k) input[k] = false; });
addEventListener("blur", () => { for (const k of ["gas", "rev", "left", "right", "boost"]) input[k] = false; });
const stick = { on: false, id: -1, ox: 0, oy: 0, x: 0, y: 0 };
const cv = renderer.domElement;
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); unlockAudio();
  if (e.pointerType === "mouse" || stick.on) return;
  Object.assign(stick, { on: true, id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY }); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", (e) => { if (stick.on && e.pointerId === stick.id) { stick.x = e.clientX; stick.y = e.clientY; } });
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => { if (e.pointerId === stick.id) stick.on = false; });
function drawStick() {
  $("stick").hidden = !stick.on; if (!stick.on) return;
  const dx = clamp(stick.x - stick.ox, -46, 46), dy = clamp(stick.y - stick.oy, -46, 46);
  $("stick").style.left = stick.ox + "px"; $("stick").style.top = stick.oy + "px"; $("stick").firstChild.style.transform = `translate(${dx}px, ${dy}px)`;
}
for (const [id, on, off] of [["bJump", () => (input.jump = true), null], ["bBoost", () => (input.boost = true), () => (input.boost = false)], ["bCam", () => (input.ballCam = !input.ballCam), null]]) {
  const b = $(id);
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); b.setPointerCapture(e.pointerId); b.classList.add("on"); on(); });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => { b.classList.remove("on"); if (off) off(); });
}
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.wasHost = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the match meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  syncViews(dt);
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const g = game();
  if (g) {
    myTick(dt, g, now);
    drawWorld(g, dt, now);
    if (now - lastHud > 100) { lastHud = now; hud(g, now); }
  }
  drawStick();
  renderer.render(scene, camera);
}

(async function start() {
  net = await connect();
  me.id = net.sessionId;
  net.onState((st) => { S = st; });
  net.on("hit", (msg, from) => { if (isHost() && msg) applyHit(msg, from); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { kickoffMs: 900, goalMs: 4300, replayDelay: 900, replayWindow: 1800, replaySpeed: 0.55, matchMs: 1e9, botError: 1.5, botBoost: 1 });
  if (TEST) window.__test = { me, ball: () => ball, game, writeGame, S: () => S, isHost, host, input, views, carOf, teamOf, replay, net: () => net };
  requestAnimationFrame(frame);
})();
</script>
